name: 'Setup Host'
description: 'Configures the host runner to run the build'

runs:
  using: "composite"
  steps:
    - name: Setup Xcode
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: sudo xcode-select --reset
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Install NPM dependencies
      shell: bash
      run: npm ci
